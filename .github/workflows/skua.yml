name: Skua
# Skua Bash's line editor (RusticStack/reedline, branch `skua`): run the library tests on Windows. Upstream workflows are disabled on this fork.
on:
  push:
    branches: [ skua ]
  pull_request:
    branches: [ skua ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  windows:
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test (library)
        run: cargo test --lib --no-fail-fast
      - name: Format
        run: cargo fmt --check
